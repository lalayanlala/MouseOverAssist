name: Build and publish MouseOverAssist

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.101

      - name: Download Dalamud API 15 reference files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile dalamud.zip
          Expand-Archive -LiteralPath dalamud.zip -DestinationPath dalamud -Force

      - name: Build and verify
        shell: pwsh
        run: .\Build.ps1 -DalamudPath "$PWD\dalamud"

      - name: Prepare release files
        shell: pwsh
        run: .\PrepareRepository.ps1 -RepositoryUrl https://github.com/${{ github.repository }} -OutputPath "$PWD\Output"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = (Get-Content .\Release\MouseOverAssist.json -Raw | ConvertFrom-Json).AssemblyVersion
          gh release create "v$tag" .\Release\latest.zip .\Release\MouseOverAssist_V2_Source.zip --title "MouseOverAssist v$tag" --notes "V2.3.15: アクション名・ジョブ名・ロール名を常に日本語で表示するよう修正しました。"
